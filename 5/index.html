<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Yehbllby</title>
</head>
<body>
    <div class="wrapper">
        <div class="timer">
            <h1>До дня рождения осталось</h1>
            <div class="timer-row">
                <div class="timer-item">
                    <h2 class="squares" id="day"></h2>
                    <div class="squares__text">дней</div>
                </div>
                  <div class="timer-item">
                    <h2 class="squares" id="hour"></h2>
                    <div class="squares__text">часов</div>
                </div>
                  <div class="timer-item">
                    <h2 class="squares" id="minute"></h2>
                    <div class="squares__text">минут</div>
                </div>
                  <div class="timer-item">
                    <h2 class="squares" id="second"></h2>
                    <div class="squares__text">секунд</div>
                </div>
            </div>
            <div class="bday">🥳С Днём Рождения тебя🎉</div>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
