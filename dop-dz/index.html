<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Yehbllby</title>
</head>

<body>
    <div class="main__block">
        <div class="box">
            <h1 class="title">Ставьте ссылу на картинку <br>
                или выбырите из устроиство и названия</h1>
            <div class="input__photo">
                <input type="text" class="input" placeholder="ссылка на картинку">
                <label class="file__input">
                    <input class="del" type="file">
                    <span>📁</span>
                </label>
            </div>
            <input type="text" placeholder="названия" class="input_name">
            <button class="btn__input">Готово</button>
        </div>
        <div class="box2">
            <img src="" alt="картинка" class="img">
            <div class="text__img"></div>
        </div>
    </div>
</body>
<script src="./script.js"></script>

</html>
